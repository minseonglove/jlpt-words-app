// Compose 컴파일러 stability 설정.
//
// domain-kmp 는 Clean Architecture 원칙상 Compose 컴파일러를 적용하지 않으므로,
// 그 모듈의 엔티티는 stability 를 추론할 수 없어 전부 unstable 로 취급된다.
// 그러면 State 를 담은 화면들이 값이 같아도 인스턴스가 다르면 재구성되어,
// 컬렉션·객체를 새로 만드는 실수 하나가 곧바로 하위 전체 재구성으로 이어진다.
//
// 엔티티는 모두 val 프로퍼티만 가진 불변 data class 이므로 stable 로 선언한다
// (Compose 는 이후 equals 로 비교한다). 엔티티에 var 나 가변 컬렉션을 추가할 때는
// 이 선언이 더 이상 성립하지 않으므로 함께 재검토할 것.
com.minseonglove.jlptwords.entity.*
