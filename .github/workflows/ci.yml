name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin:
    name: Kotlin unit tests + complexityReport
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          # complexityReport --hotspot が git の変更履歴を読むため
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests (commonTest on JVM / Android host)
        run: >
          ./gradlew
          :domain-kmp:jvmTest
          :domain-kmp:testAndroidHostTest
          :data-kmp:testAndroidHostTest
          :presentation-kmp:testAndroidHostTest
          --init-script .github/ci/exclude-content-tests.init.gradle.kts
          --console=plain

      - name: complexityReport (detekt)
        run: ./gradlew complexityReport --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "*/build/reports/tests/"

  python:
    name: Upload pipeline tests (parser / protobuf encoder)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: pytest
        working-directory: scripts/firestore_upload
        run: |
          python -m pip install pytest
          python -m pytest -q test_parsing.py test_example_blob.py
